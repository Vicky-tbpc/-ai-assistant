// --- 修正後的呼叫 Gemini API 函式 ---
let chatHistory = [];

async function callGeminiAPI(prompt) {
    const typingId = 'typing-' + Date.now();
    const historyElem = document.getElementById('chat-history'); // 確保變數名稱統一
    
    // 1. 顯示打字動畫 (修正變數名稱，並改用 insertAdjacentHTML 確保穩定性)
    if (historyElem) {
        historyElem.insertAdjacentHTML('beforeend', `
            <div class="msg-row ai-row" id="${typingId}">
                <div class="ai-bubble">
                    <div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                    <small style="color: #888; display: block; margin-top: 5px;">正在分析你的健康數據...</small>
                </div>
            </div>
        `);
    }
    scrollToBottom();


    const now = new Date();
    const currentDate = now.toLocaleDateString('en-CA'); // 格式：YYYY-MM-DD
    const currentTime = now.toTimeString().split(' ')[0]; // 格式：HH:mm:ss


    // 取得當前訊息中提到的日期
    const targetDateStr = getTargetDate(prompt); 

    try {
        const res = await fetch('/api/gemini', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                prompt: prompt,
                serial_number: currentSerial,
                record_date: targetDateStr,
                history: chatHistory, // 重要：要把對話紀錄傳給後端，記憶功能才會動！
                // --- 新增這兩行 ---
                local_date: currentDate,     
                local_time: currentTime
            })
        });
        const data = await res.json();

        // 2. 記憶功能：更新對話紀錄
        chatHistory.push({ role: "user", parts: [{ text: prompt }] });
        chatHistory.push({ role: "model", parts: [{ text: data.text }] });

        // 限制紀錄長度 (例如只留最近 10 次對話)
        if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);

        // 3. 移除動畫
        const typingElem = document.getElementById(typingId);
        if (typingElem) typingElem.remove();

        // 👇 判斷後端回傳的 action 來決定前端要做什麼動作
        if (data.action === 'open_pdf') {
            // --- 👑 新增功能：先向地端 API 檢查該日期是否有資料 ---
            try {
                // 準備查詢參數，限制只查目標日期這天
                const params = new URLSearchParams({
                    serial: currentSerial,
                    start: data.date,
                    end: data.date
                }).toString();
                
                const checkRes = await fetch(`/api/health?${params}`);
                if (!checkRes.ok) throw new Error("地端連線失敗");
                
                const checkData = await checkRes.json();
                
                // 確認回傳資料中有沒有包含這天的紀錄
                const hasReport = checkData.find(r => r.record_date === data.date);

                if (hasReport) {
                    // 有找到報告：延遲一下再產生開啟 PDF 的按鈕
                    setTimeout(() => {
                        appendPdfButton(data.date); 
                    }, 500);
                    // 讓程式繼續往下走，最後會回傳並印出原本的 data.text ("沒問題！...")
                } else {
                    // 沒找到報告：直接覆蓋掉 AI 原本的台詞，並提早 return！
                    // 這樣就不會印出「沒問題！...」，也不會產生兩句對話了
                    return `幫你確認過了，**${data.date.replace(/-/g, '/')}** 這天沒有睡眠報告喔 😅，可能是還沒記錄到或尚未同步！`;
                }
            } catch (err) {
                console.error("檢查報告發生錯誤:", err);
                // 發生錯誤：一樣覆蓋台詞並提早 return
                return `哎呀，連線檢查 **${data.date.replace(/-/g, '/')}** 的報告時發生了一點問題，請確認一下地端伺服器有沒有正常開啟喔！ 🔌`;
            }
            // --------------------------------------------------------
        } else if (data.action === 'show_trend_options') {
            // 使用者沒說清楚，跳出選單
            setTimeout(() => {
                appendTrendOptions();
            }, 500);
        } else if (data.action === 'show_specific_trend') {
            // 使用者有明確指定，直接畫特定圖表 (預設顯示 7 天)
            setTimeout(() => {
                renderTrendCard(data.trend_type, 7);
            }, 500);
        }

        return data.text;
    } catch (err) {
        console.error("API Error:", err);
        const typingElem = document.getElementById(typingId);
        if (typingElem) typingElem.remove();
        return "抱歉，我現在連不上線，請稍後再試。 😅";
    }
}

// --- 新增：取得 AI 開場白數據狀態 ---
async function getAIGreetingPayload(serial) {
    try {
        const response = await fetch(`/api/health?serial=${serial}`);
        if (!response.ok) return null;
        
        const allData = await response.json();
        allData.sort((a, b) => b.record_date.localeCompare(a.record_date));

        // 需要至少一筆最新和一筆歷史才能比較
        if (allData.length < 2) return null; 

        const latestData = allData[0];
        const pastData = allData.slice(1, 4); // 取前 1~3 天歷史

        // 定義指標與其好壞邏輯
        const fields = [
            { key: 'TST_min', higherIsBetter: true, label: '總睡眠時間' },
            { key: 'N3_pct', higherIsBetter: true, label: '深睡比例 (N3)' },
            { key: 'rMSSD', higherIsBetter: true, label: 'rMSSD (放鬆指數)' },
            { key: 'HBI', higherIsBetter: false, label: '低氧負擔指數 (HBI)' },
            { key: 'HR_min', higherIsBetter: false, label: '睡眠最低脈搏' }
        ];

        let bestMetric = null;
        let worstMetric = null;
        let maxImprovement = -Infinity;
        let maxDeterioration = -Infinity;

        const currentRaw = latestData.raw_json || {};

        fields.forEach(f => {
            let sum = 0, count = 0;
            // 計算過去最多3天的平均 (僅依據實際有數值的筆數除)
            pastData.forEach(d => {
                const val = d.raw_json?.[f.key];
                if (val !== undefined && val !== null) {
                    sum += Number(val);
                    count++;
                }
            });

            if (count > 0 && currentRaw[f.key] !== undefined) {
                const baseVal = sum / count;
                const currentVal = Number(currentRaw[f.key]);

                if (baseVal !== 0) {
                    let improvementPct = 0;
                    // 計算進步或退步幅度
                    if (f.higherIsBetter) {
                        improvementPct = (currentVal - baseVal) / Math.abs(baseVal);
                    } else {
                        improvementPct = (baseVal - currentVal) / Math.abs(baseVal);
                    }

                    if (improvementPct > maxImprovement) {
                        maxImprovement = improvementPct;
                        bestMetric = f;
                    }
                    
                    let deteriorationPct = -improvementPct;
                    if (deteriorationPct > maxDeterioration) {
                        maxDeterioration = deteriorationPct;
                        worstMetric = f;
                    }
                }
            }
        });

        if (!bestMetric && !worstMetric) return null;

        // 隨機決定要鼓勵(挑最好)還是關懷(挑最差)
        const isEncourage = Math.random() > 0.5;
        const chosenMetric = isEncourage && bestMetric ? bestMetric : worstMetric || bestMetric;
        const statusStr = (chosenMetric === bestMetric) ? '表現良好' : '表現較差';

        return {
            metric: chosenMetric.label,
            status: statusStr,
            type: (chosenMetric === bestMetric) ? '鼓勵' : '關懷'
        };

    } catch (e) {
        console.error('AI Greeting Error:', e);
        return null;
    }
}

// 向地端請求使用者的所有資料，推算出哪些日期有「健康摘要」與對應的燈號
async function fetchAvailableSummaryDates() {
    try {
        const params = new URLSearchParams({ serial: currentSerial }).toString();
        const response = await fetch(`/api/health?${params}`);
        if (response.ok) {
            const rawData = await response.json();
            // 確保留下來的資料是新到舊排序，這樣我們取 allData[0] 才會是選中的當天
            userHealthDataList = rawData.sort((a, b) => new Date(b.record_date) - new Date(a.record_date));
            
            availableSummaryDates.clear(); // 清空舊資料
            
            userHealthDataList.forEach(d => {
                if (d.raw_json) {
                    const battery = d.raw_json.Personal_Battery_weighted_round;
                    const trt = d.raw_json.TRT_min;
                    
                    // 判斷是否有值
                    const hasBattery = battery !== null && battery !== undefined;
                    const hasTRT = trt !== null && trt !== undefined;

                    // 條件1 & 2：只要其中一個有值就要顯示；如果兩個都是 null/undefined 就不做任何事
                    if (hasBattery || hasTRT) {
                        // 健康摘要的顯示日期 = 紀錄日期 (record_date) + 1 天
                        const dateObj = new Date(d.record_date.replace(/-/g, '/'));
                        dateObj.setDate(dateObj.getDate() + 1);
                        const displayDate = dateObj.toLocaleDateString('en-CA');
                        
                        const light = d.raw_json.light_status || '';
                        
                        // 儲存狀態物件，讓渲染與點擊事件都能判斷
                        availableSummaryDates.set(displayDate, {
                            hasBattery: hasBattery,
                            hasTRTOnly: !hasBattery && hasTRT, // 代表只有 TRT 有值
                            light: light,
                            trtMin: trt
                        });
                    }
                }
            });
        }
    } catch (e) {
        console.error("無法取得日曆資料，請確認地端伺服器是否開啟", e);
    }
}

// 切換月份
function changeMonth(offset) {
    currentCalDate.setMonth(currentCalDate.getMonth() + offset);
    renderCalendar();
}

// 渲染日曆畫面
function renderCalendar() {
    const year = currentCalDate.getFullYear();
    const month = currentCalDate.getMonth();
    
    document.getElementById('calendar-month-year').innerText = `${year}年 ${month + 1}月`;
    
    const firstDay = new Date(year, month, 1).getDay(); // 0(日) ~ 6(六)
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    
    const grid = document.getElementById('calendar-grid');
    let html = '';
    
    const dayHeaders = ['日', '一', '二', '三', '四', '五', '六'];
    dayHeaders.forEach(day => {
        html += `<div class="calendar-day-header">${day}</div>`;
    });
    
    // 填補當月第一天前面的空格
    for (let i = 0; i < firstDay; i++) {
        html += `<div class="calendar-day empty"></div>`;
    }
    
    const todayStr = getLocalDateString();

    // 產生每一天
    for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        
        // 取得該日期的資料狀態
        const dateData = availableSummaryDates.get(dateStr);
        const hasData = !!dateData;
        const isToday = dateStr === todayStr;
        
        let classNames = 'calendar-day';
        let extraStyle = '';
        
        if (hasData) {
            classNames += ' has-data';
            
            // 條件2：只有 TRT_min 有數值且 Battery 沒有數值時
            if (dateData.hasTRTOnly) {
                // 改為套用 status-default 樣式類別
                classNames += ' status-default';
            } 
            // 條件1：Battery 有數值，依據 light_status 呈現
            else {
                if (dateData.light === '綠燈') classNames += ' status-green';
                else if (dateData.light === '黃燈') classNames += ' status-yellow';
                else if (dateData.light === '黃紅燈') classNames += ' status-orange';
                else if (dateData.light === '紅燈') classNames += ' status-red';
                else classNames += ' status-default'; 
            }
        } else {
            classNames += ' disabled'; // 無資料反灰
        }
        
        if (isToday) classNames += ' today';
        
        if (hasData) {
            html += `<div class="${classNames}" ${extraStyle} onclick="selectCalendarDate('${dateStr}')">${day}</div>`;
        } else {
            html += `<div class="${classNames}">${day}</div>`;
        }
    }
    
    grid.innerHTML = html;
}

// 點選日期後執行查詢
async function selectCalendarDate(dateStr) {
    closeCalendarModal();
    const dateData = availableSummaryDates.get(dateStr);
    
    // 將顯示日期轉回前一天的紀錄日期
    const dateObj = new Date(dateStr.replace(/-/g, '/'));
    dateObj.setDate(dateObj.getDate() - 1);
    const preDateStr = dateObj.toLocaleDateString('en-CA');
    
    // 條件3：如果是上述條件2 (只有 TRT_min)，點選後執行「找出惡化最多指標」並推派小卡的邏輯
    if (dateData && dateData.hasTRTOnly) {
        appendUserMessage(`查詢 ${dateStr} 睡眠分析`);
        await processSleepAnalysisByDate(preDateStr);
    } else {
        // 原本 Battery 有數值時走這邊
        appendUserMessage(`查詢 ${dateStr} 健康摘要`);
        await processSummarySearch(preDateStr, dateStr);
    }
}

// ==========================================
// 新增一支獨立 function，直接套用你寫好的邏輯
// ==========================================
async function processSleepAnalysisByDate(targetPreDateStr) {
    // 1. 從我們先前存好的資料，找出目標日期的 index
    const targetIndex = userHealthDataList.findIndex(d => d.record_date === targetPreDateStr);
    
    if (targetIndex === -1) {
        await appendAiMessage("找不到該日期的詳細數據喔！");
        return;
    }

    // 取出從「該天(含)以前」的所有資料，這樣 allData[0] 就會是我們點擊的那一天
    const allData = userHealthDataList.slice(targetIndex);

    // ======= 以下完全套用你提供的判斷邏輯 =======
    const latestData = allData[0]; // 擷取資料庫中最新的那一筆
    const pastData = allData.slice(1); // 剩下的歷史數據
    const fields = ['TST_min', 'N3_pct', 'rMSSD', 'HBI', 'HR_min'];
    let baseline = {};

    // 👇 新增：檢查這一筆資料的 TRT_min 是否有值
    const currentRaw = latestData.raw_json || {};
    const hasTRT = currentRaw.TRT_min !== undefined && currentRaw.TRT_min !== null;

    // 👇 根據是否有 TRT_min 決定是否顯示睡眠報告按鈕
    const reportButtonHtml = hasTRT ? `
        <div style="text-align: right;">
            <button onclick="openSleepReport('${targetPreDateStr}')" style="background-color: #a79d8c; color: white; border: none; padding: 6px 14px; border-radius: 15px; font-size: 0.85em; cursor: pointer; transition: opacity 0.2s;" onmouseover="this.style.opacity=0.8" onmouseout="this.style.opacity=1">
                📄 開啟睡眠報告
            </button>
        </div>` : '';

    // 2. 決定比較基準：有3天歷史就算平均，沒有3天就只抓前一天
    if (pastData.length >= 3) {
        const recent3 = pastData.slice(0, 3);
        fields.forEach(f => {
            let sum = 0, count = 0;
            recent3.forEach(d => {
                if (d.raw_json && d.raw_json[f] !== undefined) {
                    sum += Number(d.raw_json[f]);
                    count++;
                }
            });
            // 按照實際有數據的天數來除以取得平均值
            baseline[f] = count > 0 ? sum / count : null;
        });
    } else if (pastData.length > 0) { 
        // 加上判斷確保 pastData 裡面真的有資料才抓 prev1，避免剛好是第一天使用時報錯
        const prev1 = pastData[0];
        fields.forEach(f => {
            baseline[f] = (prev1.raw_json && prev1.raw_json[f] !== undefined) ? Number(prev1.raw_json[f]) : null;
        });
    } else {
        // 如果完全沒有歷史資料可以比
        fields.forEach(f => baseline[f] = null);
    }

    // 3. 找出差異(惡化)最多的指標
    let maxDeviation = -Infinity;
    let worstMetric = null;

    fields.forEach(f => {
        const currentVal = currentRaw[f];
        const baseVal = baseline[f];

        if (currentVal !== undefined && baseVal !== null && baseVal !== 0) {
            let deviation = 0;
            // 將差異轉換為百分比幅度，以便不同單位的指標能公平比較
            if (f === 'TST_min' || f === 'N3_pct' || f === 'rMSSD') {
                // 越低越差：(基準值 - 當前值) / 基準值 => 正值越大代表下降越多
                deviation = (baseVal - currentVal) / Math.abs(baseVal);
            } else if (f === 'HBI' || f === 'HR_min') {
                // 越高越差：(當前值 - 基準值) / 基準值 => 正值越大代表上升越多
                deviation = (currentVal - baseVal) / Math.abs(baseVal);
            }

            if (deviation > maxDeviation) {
                maxDeviation = deviation;
                worstMetric = f;
            }
        }
    });

    // 4. 如果因為缺少數值算不出任何比較結果 (例如第一天使用，沒有歷史數據)
    if (!worstMetric) {
        // 給一句適合第一天使用的專屬對話
        await appendAiMessage("收到了！😊 你可以直接點選下方按鈕查看完整的睡眠報告喔！");
        
        // 直接推派一張帶有 PDF 按鈕的簡化版卡片 (加入 reportButtonHtml 判斷)
        const fallbackHtml = `
            <div class="ai-message-wrapper">
                <div class="ai-message" style="max-width: 85%; padding: 15px; border-radius: 18px; border-left: 5px solid #a79d8c; background-color: #ffffff;">
                    <div style="font-weight: bold; font-size: 1.1em; color: #666; margin-bottom: 12px;">
                        🛌 睡眠紀錄
                    </div>
                    ${reportButtonHtml}
                </div>
            </div>`;
        
        document.getElementById('chat-history').insertAdjacentHTML('beforeend', fallbackHtml);
        scrollToBottom();
        
        return;
    }

    // 5. 轉換為 phrase_library 對應的 logic_key 前綴
    const metricPrefixMap = {
        'TST_min': 'Battery 總睡眠時間',
        'N3_pct': 'Battery N3',
        'rMSSD': 'Battery rMSSD',
        'HBI': 'Battery HBI',
        'HR_min': 'Battery 最低脈搏'
    };

    const prefix = metricPrefixMap[worstMetric];
    const randomNum = Math.floor(Math.random() * 3) + 1; // 隨機 1、2、3
    const logicKey = `${prefix}最差${randomNum}`;

    try {
        const { data: phraseData } = await _supabase
            .from('phrase_library')
            .select('detailed_content')
            .eq('logic_key', logicKey)
            .limit(1)
            .maybeSingle();

        if (phraseData && phraseData.detailed_content) {
            // 先說一句話，然後推派小卡
            await appendAiMessage(`收到了！😊 幫你分析了一下數據：`);
            // 👇 修改這裡：把 hasTRT 當作第四個參數傳進去
            appendSimpleSummaryCard(worstMetric, phraseData.detailed_content, targetPreDateStr, hasTRT);
        }
    } catch (e) {
        console.error("Supabase 查詢錯誤：", e);
    }
}
